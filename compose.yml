services:
  # 仅初始化宿主机数据目录权限；正式服务仍以镜像内非 root 用户运行。
  volume-init:
    image: ${OBJ_TO_3DTILES_IMAGE:-dz98/obj-to-3dtiles-service:v3.1}
    # v3.1 当前作为持续发布标签；每次启动前检查远端，避免已有旧镜像时静默跳过更新。
    pull_policy: always
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        runtime_uid="$${APP_UID:-1654}"
        mkdir -p /data/obj2tiles/input /data/obj2tiles/output /data/obj2tiles/state
        chown "$${runtime_uid}:$${runtime_uid}" \
          /data/obj2tiles/input /data/obj2tiles/output /data/obj2tiles/state
        chown -R "$${runtime_uid}:$${runtime_uid}" /data/obj2tiles/state
        chmod 0755 /data/obj2tiles/input /data/obj2tiles/output /data/obj2tiles/state
    volumes:
      - type: bind
        # Windows 默认 %USERPROFILE%/obj-to-3dtiles-service-data；Linux 默认 /var/lib/obj-to-3dtiles-service-data。
        # OBJ_TO_3DTILES_DATA_ROOT 非空时优先使用调用方指定的绝对路径。
        source: ${OBJ_TO_3DTILES_DATA_ROOT:-${USERPROFILE:-/var/lib}/obj-to-3dtiles-service-data}
        target: /data/obj2tiles
        bind:
          create_host_path: true
          selinux: z
    restart: "no"

  obj-to-3dtiles-service:
    image: ${OBJ_TO_3DTILES_IMAGE:-dz98/obj-to-3dtiles-service:v3.1}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      volume-init:
        condition: service_completed_successfully
    ports:
      - "${OBJ_TO_3DTILES_PORT:-8091}:8080"
    environment:
      Conversion__InputRoot: /data/obj2tiles/input
      Conversion__OutputRoot: /data/obj2tiles/output
      Conversion__StateRoot: /data/obj2tiles/state
      Conversion__MaxConcurrentJobs: "1"
      Conversion__JobTimeoutMinutes: "720"
    volumes:
      - type: bind
        source: ${OBJ_TO_3DTILES_DATA_ROOT:-${USERPROFILE:-/var/lib}/obj-to-3dtiles-service-data}
        target: /data/obj2tiles
        bind:
          create_host_path: true
          selinux: z
    healthcheck:
      test: ["CMD", "dotnet", "/app/health/HealthProbe.dll"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    # 不固定 24G cgroup 上限：让服务按部署机器实际可见内存自动选择 2G/4G/高内存档位。
    # 共享宿主机如需硬隔离，可在 compose.override.yml 中为本服务增加 resources.limits。
